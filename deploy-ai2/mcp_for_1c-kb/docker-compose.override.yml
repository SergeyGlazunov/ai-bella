# ai2-kb: graph + query-builder. Do NOT attach to prod ai-stack_default here.
services:
  qdrant:
    profiles: ["unused"]
  help-indexer:
    profiles: ["unused"]
  workspace-watcher:
    profiles: ["unused"]
  mcp-bsl-checker:
    profiles: ["unused"]
  mcp-platform-help:
    profiles: ["unused"]
  v8std-mcp:
    profiles: ["unused"]

  mcp-query-builder:
    ports: !override
      - "0.0.0.0:${QUERY_PORT:-8209}:8009"
    environment:
      - MCP_DNS_REBINDING_PROTECTION=0
      - MCP_ALLOWED_HOSTS=${QUERY_ALLOWED_HOSTS}
      - NEO4J_HTTP_TIMEOUT_SEC=${NEO4J_HTTP_TIMEOUT_SEC:-90}
      - NEO4J_PROBE_TIMEOUT_SEC=${NEO4J_PROBE_TIMEOUT_SEC:-45}
    networks:
      - default
    restart: unless-stopped

  mcp-metadata-graph:
    ports: !override
      - "0.0.0.0:${MCP_PORT:-8201}:8001"
      - "127.0.0.1:9200:9000"
    environment:
      - MCP_DNS_REBINDING_PROTECTION=0
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS}
      - WATCHER_ENABLED=false
      - METADATA_WATCH_ENABLED=false
      - ENABLE_WATCH_TOOLS=0
      - NEO4J_HTTP_TIMEOUT_SEC=${NEO4J_HTTP_TIMEOUT_SEC:-90}
      - NEO4J_PROBE_TIMEOUT_SEC=${NEO4J_PROBE_TIMEOUT_SEC:-45}
    networks:
      - default
    restart: unless-stopped

  neo4j:
    ports: !override
      - "127.0.0.1:7674:7474"
      - "127.0.0.1:7887:7687"
    environment:
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://127.0.0.1:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  metadata-indexer:
    restart: "no"
