schema_version: 2

# Shared runtime for the Linux contour stand. Paths are kit placeholders —
# no live hostnames, credentials, or private URLs.
runtime:
  root: /srv/ai-contour
  db_path: /srv/ai-contour/state/state.db
  lock_path: /srv/ai-contour/locks/sync.lock
  logs_path: /srv/ai-contour/logs/runs
  backups_path: /srv/ai-contour/backups/state
  # Total observation budget for one writer stage. Long stages (graph FULL
  # ~5.3 h) are observed to completion in the same night; jobs never killed.
  writer_max_observe_seconds: 21600
  # Refuse heavy update work when free space under runtime.root is below
  # this threshold (GiB). Fails the database run with an alert before any
  # clone/copy or read close.
  min_free_gb: 5
  # Retention after each verified publish: keep this many newest accepted
  # packages per package database (the published revision's package always
  # stays), keep only the newest previous-source snapshot, delete finished
  # runs/jobs older than retain_runs_days days.
  retain_packages: 3
  retain_runs_days: 90

schedule:
  window_start: "01:30"
  window_end: "06:00"
  timezone: Asia/Vladivostok
  # Warn if a job runs longer than this many seconds. Not a kill deadline.
  # null: no duration warning; automatic writes still allowed inside the window.
  duration_warn_seconds: null
  # deprecated alias; prefer duration_warn_seconds
  build_deadline_seconds: null
  measure_max_seconds: 43200   # optional --measure log cap; does not kill jobs

alert:
  # Replace with a real on-call channel. The kit example refuses until replaced
  # (or CONTOUR_ALERT_ALLOW_LOG=1 for local dry-run only).
  command: ["/opt/ai-contour/alert.sh"]

# N database profiles. Set enabled: false to keep a profile in the file
# without scheduling it. Names are free-form; this example ships three.
databases:
  ubd:
    enabled: true
    required_layers: [graph, code_index]
    source:
      type: git
      path: /srv/ai-contour/sources/ubd
      remote: "https://example.invalid/ubd.git"
      branch: main
      workspace_subdir: src
    services:
      graph_compose_dir: /srv/ai-contour/compose/graph-ubd
      graph_project: ai2-mcp-ubd
      graph_service: metadata-indexer
      graph_mcp: mcp-metadata-graph
      # Neo4j container for probe_graph.sh (NEO4J_CONTAINER). Required per DB when
      # graph probes run; not derived from storage.graph_volume. Set the real
      # compose service/container name on the stand (do not guess from the volume).
      neo4j_container: ""
      bsl_compose_dir: /srv/ai-contour/compose/bsl-ubd
      bsl_project: ai2-bsl-ubd
      bsl_container: bsl-indexer
      bsl_publish_port: 8011
      bsl_daemon_toml: /srv/ai-contour/compose/bsl-ubd/daemon.toml
      webui_network: ai-stack_default
    storage:
      graph_volume: ai2-neo4j-ubd-data
      code_index_volume: ai2-bsl-ubd-home
    adapters:
      idle_probe:
        - /opt/ai-contour/integrations/idle_bsl.sh
      code_index:
        check_bsl:
          - /opt/ai-contour/integrations/probe_code_index.sh
          - present
          - "{path}"
        check_deletion:
          - /opt/ai-contour/integrations/probe_code_index.sh
          - absent
          - "{path}"
      graph:
        check_bsl:
          - /opt/ai-contour/integrations/probe_graph.sh
          - present
          - "{path}"
        check_xml:
          - /opt/ai-contour/integrations/probe_graph.sh
          - present
          - "{path}"
        check_deletion:
          - /opt/ai-contour/integrations/probe_graph.sh
          - absent
          - "{path}"

  kb:
    enabled: true
    required_layers: [graph, code_index]
    source:
      type: package
      inbox: /srv/ai-contour/inbox/kb
      source_path: /srv/ai-contour/sources/kb
    services:
      graph_compose_dir: /srv/ai-contour/compose/graph-kb
      graph_project: ai2-mcp-kb
      graph_service: metadata-indexer
      graph_mcp: mcp-graph-kb
      neo4j_container: ""
      bsl_compose_dir: /srv/ai-contour/compose/bsl-kb
      bsl_project: ai2-bsl-kb
      bsl_container: bsl-kb
      bsl_publish_port: 8211
      bsl_daemon_toml: /srv/ai-contour/compose/bsl-kb/daemon.toml
      webui_network: ai-stack_default
    storage:
      graph_volume: ai2-neo4j-kb-data
      code_index_volume: ai2-bsl-kb-home
    adapters:
      idle_probe:
        - /opt/ai-contour/integrations/idle_bsl.sh
      code_index:
        check_bsl:
          - /opt/ai-contour/integrations/probe_code_index.sh
          - present
          - "{path}"
        check_deletion:
          - /opt/ai-contour/integrations/probe_code_index.sh
          - absent
          - "{path}"
      graph:
        check_bsl:
          - /opt/ai-contour/integrations/probe_graph.sh
          - present
          - "{path}"
        check_xml:
          - /opt/ai-contour/integrations/probe_graph.sh
          - present
          - "{path}"
        check_deletion:
          - /opt/ai-contour/integrations/probe_graph.sh
          - absent
          - "{path}"

  klon_opl:
    enabled: true
    required_layers: [code_index]
    source:
      type: package
      inbox: /srv/ai-contour/inbox/klon_opl
      source_path: /srv/ai-contour/sources/klon_opl
    services:
      # Graph fields unused when graph is not in required_layers.
      graph_compose_dir: ""
      graph_project: ""
      graph_service: ""
      graph_mcp: ""
      neo4j_container: ""
      bsl_compose_dir: /srv/ai-contour/compose/bsl-klon-opl
      bsl_project: ai2-bsl-klon-opl
      bsl_container: bsl-klon-opl
      bsl_publish_port: 8311
      bsl_daemon_toml: /srv/ai-contour/compose/bsl-klon-opl/daemon.toml
      webui_network: ai-stack_default
    storage:
      graph_volume: ""
      code_index_volume: ai2-bsl-klon-opl-home
    adapters:
      idle_probe:
        - /opt/ai-contour/integrations/idle_bsl.sh
      code_index:
        check_bsl:
          - /opt/ai-contour/integrations/probe_code_index.sh
          - present
          - "{path}"
        check_deletion:
          - /opt/ai-contour/integrations/probe_code_index.sh
          - absent
          - "{path}"
      graph:
        check_bsl:
          - /opt/ai-contour/integrations/probe_graph.sh
          - present
          - "{path}"
