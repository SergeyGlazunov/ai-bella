[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contour"
version = "0.1.0"
description = "AI-Contour orchestrator"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "tzdata",  # ZoneInfo IANA zones on Windows
]

[project.scripts]
contour = "contour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
